<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="w-4xl mx-auto mt-64 border p-8">
      <p class="text-2xl">Formulário</p>

      <form
        action="formulario.html"
        method="post"
        enctype="multipart/form-data"
      >
        <div class="flex flex-col mt-4">
          <label for="nome">Nome *</label>
          <input
            type="text"
            id="nome"
            name="nome"
            class="border p-2 user-invalid:border-red-500"
            placeholder="Digite o seu nome completo"
            required
            minlength="5"
            autocomplete="name"
          />
          <small class="text-gray-500 hidden"
            >No minimo deve ter 5 caracteres.</small
          >
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div class="flex flex-col mt-4">
            <label for="email">Email *</label>
            <input
              type="email"
              id="email"
              name="email"
              class="border p-2 user-invalid:border-red-500"
              placeholder="Ex: nome@exemplo.com"
              required
              autocomplete="email"
            />
          </div>
          <div class="flex flex-col mt-4">
            <label for="data-nascimento">Data de Nascimento *</label>
            <input
              type="date"
              id="data-nascimento"
              name="data-nascimento"
              class="border p-2 user-invalid:border-red-500"
              required
            />
          </div>
          <div class="flex flex-col">
            <label for="foto pessoal">Foto Pessoal</label>
            <input
              type="file"
              id="foto pessoal"
              name="foto pessoal"
              class="border p-2 user-invalid:border-red-500"
              accept="image/*"
            />
          </div>
          <div class="flex flex-col">
            <label for="codigo-postal">Código Postal</label>
            <input
              type="text"
              id="codigo-postal"
              name="codigo-postal"
              class="border p-2 user-invalid:border-red-500"
              placeholder="Ex: 1234-567"
              required
              pattern="[0-9]{4}-[0-9]{3}"
            />
          </div>
          <div class="flex flex-col">
            <label for="opcao">Género</label>
            <select
              id="opcao"
              name="opcao"
              class="border p-2 user-invalid:border-red-500"
              required
            >
              <option value="">Selecione um género</option>
              <option value="masc">Masculino</option>
              <option value="fem">Feminino</option>
              <option value="outro">Outro</option>
            </select>
          </div>

          <div class="flex flex-col">
            <label for="">Deseja assinar a newsletter?</label>
            <div class="flex gap-5 mt-2">
              <label for="rb1"
                ><input
                  type="radio"
                  id="rb1"
                  name="newsletter"
                  value="s"
                  required
                />
                Sim</label
              >
              <label for="rb2"
                ><input
                  type="radio"
                  id="rb2"
                  name="newsletter"
                  value="n"
                  required
                />
                Não</label
              >
            </div>
          </div>
        </div>

        <div class="flex flex-col mt-10">
          <label for="mensagem">Observações</label>
          <textarea
            class="border p-2"
            name="mensagem"
            id="mensagem"
            cols="30"
            rows="5"
            placeholder="Escreva aqui a sua mensagem"
          ></textarea>
        </div>

        <div class="mt-4">
          <button
            type="submit"
            class="bg-blue-500 text-white p-2 rounded hover:bg-blue-600"
          >
            Enviar
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
