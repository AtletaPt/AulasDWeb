<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 1</title>
  </head>
  <body style="background-color: rgb(197, 56, 56)">
    <div>Hello world!</div>
    <div>Hello world!</div>
    <!-- uma div trabalha em blocks, ou seja, ocupa toda a largura disponível -->

    <span>Olá mundo!</span>
    <span>Olá mundo!</span>
    <!-- um span trabalha em inline, ou seja, ocupa apenas o espaço necessário -->

    <!-- formatação de texto por defeito -->
    <h1>titulo</h1>
    <h2>subtitulo</h2>
    <h3>sub-subtitulo</h3>
    <p>parágrafo!</p>

    <!--  semântica  -->
    <header>cabeçalho</header>
    <nav>menu de navegação</nav>
    <main>conteúdo principal</main>
    <footer>rodapé</footer>

    <div style="width: 150px; height: 100px">
      formatação da div com limitação da largura, altura e cor de fundo
    </div>
  </body>
</html>
